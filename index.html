<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Boostrap Forms and Nevbar</title>
 <style>
        body{
            background-image: url(https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/38df9671-1633-4828-b705-5972dadf6a57/OBMC+Quadrangle+2.jpg?format=1000w);
            background-size: cover;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Logo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNevbar">
                <ul class="navbar-nav">
                    <li class="navbar-item">
                    <a class="navbar-link" href="#">Homepage</a>
                    </li>
                    <li class="navbar-item">
                    <a class="navbar-link" href="#">Contact Us</a>
                    </li>
                    <li class="navbar-item">
                        <a class="navbar-link" href="#">About Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
<h2>Contact Us</h2>
   
      <div class="info-item">
        <strong>Phone</strong>
        <p>+63 2 8722 9720</p>
      </div>
    </div>

    <div class="contact-form">
      <h2>Send a Message</h2>
      <form action="#" method="POST">
        
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Daniel Todd" required>
        </div>


        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="malcolmcaesar.67@gmial.com" required>
        </div>


        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>


        <button type="submit" class="submit-btn">Send Message</button>

      </form>
    </div>
  </div>
</body>
</html>
